# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing
exec-once = [workspace 1 silent] kitty -- tmux new-session -A -s 0-main
exec-once = [workspace 2 silent] zen-browser
exec-once = [workspace 3 silent] obsidian
exec-once = [workspace 4 silent] webcord
exec-once = [workspace 10 silent] zen-browser --profile ~/.zen/*.AIGPT --kiosk
exec-once = [workspace special:youtube silent] kitty -o background_opacity=1.0 --hold sh -c 'kitty @ launch --location=vsplit cava ; kitty @ resize-window --axis vertical --increment -20 ; ~/.local/bin/yt'
exec-once = [workspace special:todo silent] ~/Applications/Todoist*.AppImage
