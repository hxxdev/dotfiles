# Theme
include current-theme.conf

# Windows
single_window_margin_width 0
active_border_color cyan
inactive_border_color #444444
window_border_width 2pt
enabled_layouts tall, grid, horizontal, vertical

# Background
# background_image                /home/hxxdev/dev/tools/wallpapers/astronaut.png
# background_image_layout         cscaled
# background_image_opacity        1.0
background_opacity 1.0
background_tint 0.8

# Tab bar (kitty always shows it unless configured otherwise)
tab_bar_edge                    bottom
tab_bar_style                   powerline
tab_title_template              "{title}"
tab_powerline_style slanted

map f1 launch --cwd=current
copy_on_select yes


# BEGIN_KITTY_FONTS
font_family      family="UbuntuMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size        16
